[build]
  command = "npm run build"
  publish = "dist"

# Single Page App fallback routing for React Router v7
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache index.html so users get immediate deploys
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
